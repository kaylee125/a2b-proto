  <main id="view"></main>

  <nav id="tabs">

    <button data-go="#/area"><svg><use href="#i-map"/></svg>입지</button>
    <button data-go="#/plan"><svg><use href="#i-plan"/></svg>자금 계획</button>

  <div id="bd"></div>
  <div id="sheet"><div class="grab"></div><div class="sh-h" id="sh-h"></div><div class="sh-b" id="sh-b"></div></div>
  <div id="splash"><svg class="lg"><use href="#i-logo"/></svg><h1>갈아탈까</h1><p>내 집과 후보 단지의 흐름을 보고<br>갈아타기 자금을 계획해요</p></div>
</div></div>
